apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-service:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  zero-downtime.json: |
    {
      "uid": "zero-downtime",
      "title": "Zero-Downtime Deployment Demo",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 2,
      "refresh": "5s",
      "time": { "from": "now-5m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "RPS per Pod",
          "description": "Traffic distribution across pods — shows how load shifts during rolling update",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (pod) (rate(http_requests_total[30s]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" }
          }
        },
        {
          "id": 2,
          "title": "Total RPS",
          "description": "Aggregate request rate — must not drop during deployment",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "color": { "fixedColor": "green", "mode": "fixed" } }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[30s]))",
              "legendFormat": "Total RPS",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Success Rate",
          "description": "Percentage of successful (non-5xx) requests — target: 100%",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 95,
              "max": 100,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 99 },
                  { "color": "green", "value": 99.9 }
                ]
              },
              "custom": { "lineWidth": 2 }
            }
          },
          "targets": [
            {
              "expr": "(1 - sum(rate(http_requests_total{status=~\"5..\"}[30s])) / sum(rate(http_requests_total[30s]))) * 100",
              "legendFormat": "Success Rate %",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Status Distribution",
          "description": "2xx vs 5xx volume over time — green zone is healthy traffic",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "options": {
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 60,
                "lineWidth": 1,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "2xx OK" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "5xx Error" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }
                ]
              }
            ]
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status=~\"2..\"}[30s]))",
              "legendFormat": "2xx OK",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[30s]))",
              "legendFormat": "5xx Error",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Response Latency",
          "description": "p50 / p95 / p99 — latency spike during rolling update is expected and temporary",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        },
        {
          "id": 8,
          "title": "Latency Heatmap",
          "description": "Request duration distribution — bright = many requests at that latency bucket",
          "type": "heatmap",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "options": {
            "calculate": false,
            "yAxis": { "unit": "s", "decimals": 3 },
            "color": { "scheme": "Spectral", "steps": 64, "reverse": false },
            "tooltip": { "show": true, "yHistogram": false },
            "exemplars": { "color": "rgba(255,0,255,0.7)" }
          },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_bucket[30s])) by (le)",
              "legendFormat": "{{le}}",
              "refId": "A",
              "format": "heatmap"
            }
          ]
        },
        {
          "id": 5,
          "title": "Active Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "count(up{job=\"myapp\"})",
              "legendFormat": "Pods",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Total Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 24 },
          "targets": [
            {
              "expr": "sum(http_requests_total)",
              "legendFormat": "Total",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards/providers.yaml
              subPath: providers.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  selector:
    app: grafana
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000