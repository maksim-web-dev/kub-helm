apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-service:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  zero-downtime.json: |
    {
      "uid": "zero-downtime",
      "title": "Zero-Downtime Deployment Demo",
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "5s",
      "time": { "from": "now-5m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "RPS per Pod",
          "description": "Shows how traffic shifts from old pods to new ones during rolling update",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum by (pod) (rate(http_requests_total[30s]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" }
          }
        },
        {
          "id": 2,
          "title": "Total RPS",
          "description": "Total RPS — should not drop during deployment",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[30s]))",
              "legendFormat": "Total RPS",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Error Rate (5xx)",
          "description": "Must stay at 0 during zero-downtime deployment",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "color": { "fixedColor": "red", "mode": "fixed" } }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[30s]))",
              "legendFormat": "Errors/s",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Response Latency p95",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[30s])))",
              "legendFormat": "p99",
              "refId": "B"
            }
          ]
        },
        {
          "id": 5,
          "title": "Active Pods",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "count(up{job=\"myapp\"})",
              "legendFormat": "Pods",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Total Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 16 },
          "targets": [
            {
              "expr": "sum(http_requests_total)",
              "legendFormat": "Total",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards/providers.yaml
              subPath: providers.yaml
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-providers
          configMap:
            name: grafana-dashboard-providers
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  selector:
    app: grafana
  type: LoadBalancer
  ports:
    - port: 3000
      targetPort: 3000